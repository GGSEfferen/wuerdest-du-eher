<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Würdest du lieber …?</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff8ec;--ink:#2b2340;--a:#ff8a5c;--b:#4cc3d9;--card:#fff;--chip:#ffe3b8;--mute:#6b6385}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1830;--ink:#f6f1ff;--a:#e0693c;--b:#2b97ad;--card:#2a2344;--chip:#3b3260;--mute:#b3aad0}}
:root[data-theme="dark"]{--bg:#1d1830;--ink:#f6f1ff;--a:#e0693c;--b:#2b97ad;--card:#2a2344;--chip:#3b3260;--mute:#b3aad0}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:clamp(1.5rem,6vw,2.3rem);margin:8px 0 4px;text-align:center}
.sub{color:var(--mute);margin:0 0 12px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px;max-width:720px}
.chip{border:0;background:var(--chip);color:var(--ink);padding:8px 14px;border-radius:99px;font:inherit;font-size:.95rem;cursor:pointer}
.chip.on{outline:3px solid var(--ink)}
.cat{font-weight:bold;color:var(--mute);margin-bottom:6px}
.q{font-size:clamp(1.3rem,5vw,1.9rem);font-weight:bold;text-align:center;margin:4px 0 14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:720px}
.opt{border:0;border-radius:22px;padding:22px 12px;min-height:220px;color:#fff;font:inherit;font-size:clamp(1.05rem,4vw,1.5rem);font-weight:bold;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:transform .15s,opacity .2s}
.opt:active{transform:scale(.97)}
.opt .e{font-size:clamp(3rem,14vw,5rem)}
#oa{background:var(--a)}#ob{background:var(--b)}
.opt.dim{opacity:.35}.opt.pick{transform:scale(1.03);outline:5px solid var(--ink)}
.bar{display:flex;gap:10px;align-items:center;margin-top:16px;width:100%;max-width:720px;justify-content:space-between}
.next{background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:14px 26px;font:inherit;font-size:1.1rem;font-weight:bold;cursor:pointer}
.next:disabled{opacity:.3;cursor:default}
.count{color:var(--mute)}
.end{text-align:center;padding:40px 10px}
.end .e{font-size:4rem}
.tools{display:flex;gap:8px;margin-bottom:14px}
.next.ghost{background:var(--chip);color:var(--ink)}
.ov{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px;display:none;z-index:20}
.ov.show{display:block}
.ov>*{max-width:720px;margin-left:auto;margin-right:auto}
.mh{display:flex;justify-content:space-between;align-items:center;font-size:1.3rem}
.ov h3{margin:18px auto 6px}
.mi{display:block;width:100%;max-width:720px;text-align:left;background:var(--card);color:var(--ink);border:0;border-radius:14px;padding:12px 14px;margin:0 auto 8px;font:inherit;cursor:pointer}
.mi i{color:var(--mute)}
@media (max-width:480px){.opt{min-height:180px;padding:14px 8px}}
</style>
</head>
<body>
<h1>Würdest du lieber …? 🤔</h1>
<p class="sub">Tippe auf deine Wahl. Es gibt kein Richtig oder Falsch!</p>
<div class="chips" id="chips"></div>
<div class="tools"><button class="chip" id="menub">☰ Alle Fragen</button><button class="chip" id="mixb">🔀 Mischen</button></div>
<div class="ov" id="menu"></div>
<main id="game" style="width:100%;max-width:720px;display:flex;flex-direction:column;align-items:center"></main>
<script>
var Q=[
["Tiere","🐉","einen kleinen Drachen als Haustier haben","🦄","ein Einhorn als Haustier haben"],
["Tiere","🐧","mit Pinguinen im Schnee spielen","🐬","mit Delfinen im Meer schwimmen"],
["Tiere","🦜","einen Papagei haben, der alles nachspricht","🐢","eine Schildkröte haben, die 200 Jahre alt wird"],
["Tiere","🦒","so groß wie eine Giraffe sein","🐜","so klein wie eine Ameise sein"],
["Tiere","🐘","einen Elefanten als Sitznachbarn haben","🦖","einen Mini-Dino im Rucksack haben"],
["Tiere","🐦","wie ein Vogel fliegen können","🐟","wie ein Fisch unter Wasser atmen können"],
["Superkräfte","🦸","durch Wände gehen können","🫥","unsichtbar sein"],
["Superkräfte","⚡","superschnell rennen können","💪","superstark sein"],
["Superkräfte","🧠","Gedanken lesen können","🔮","in die Zukunft sehen können"],
["Superkräfte","🐾","mit Tieren sprechen können","🕷️","wie eine Spinne an Wänden klettern können"],
["Superkräfte","⏸️","die Zeit anhalten können","🪄","dich in jedes Tier verwandeln können"],
["Essen","🍕","ein Jahr lang nur Pizza essen","🍝","ein Jahr lang nur Nudeln essen"],
["Essen","🍦","Eis zum Frühstück essen","🥞","Pfannkuchen zum Abendessen essen"],
["Essen","🍫","einen Fluss aus Schokolade haben","🍭","Wolken aus Zuckerwatte haben"],
["Essen","🌈","Essen haben, das die Farbe wechselt","🔊","Essen haben, das lustige Geräusche macht"],
["Essen","🍟","Pommes mit Ketchup essen","🍿","so viel Popcorn essen, wie du willst"],
["Abenteuer","🏝️","auf einer einsamen Insel leben","🏰","in einem Schloss wohnen"],
["Abenteuer","🚀","zum Mond fliegen","🤿","zum Meeresgrund tauchen"],
["Abenteuer","🌳","im Baumhaus übernachten","⛺","im Zelt am See schlafen"],
["Abenteuer","🗺️","einen Schatz suchen","🕵️","ein Geheimnis lösen"],
["Abenteuer","🎢","Achterbahn mit Looping fahren","🛶","mit dem Floß einen Fluss hinunterfahren"],
["Fantasie","🧚","in einer Märchenwelt leben","🤖","in einer Roboterwelt leben"],
["Fantasie","🧱","in einem Haus aus Lego wohnen","🍪","in einem Haus aus Lebkuchen wohnen"],
["Fantasie","🌈","auf einem Regenbogen rutschen","☁️","auf Wolken hüpfen"],
["Fantasie","🐲","auf einem Drachen reiten","🧙","zaubern können"],
["Fantasie","🎨","alles zum Leben erwecken, was du malst","🏗️","alles fliegen lassen, was du baust"],
["Schule & Freizeit","🏖️","am Strand zur Schule gehen","🌲","im Wald zur Schule gehen"],
["Schule & Freizeit","🎮","einen Tag lang alles bestimmen dürfen","🎁","jeden Monat einen Wunsch frei haben"],
["Schule & Freizeit","🖌️","einen Tag lang nur malen","⚽","einen Tag lang nur Sport machen"],
["Schule & Freizeit","🎪","einen Tag lang Zirkusartist sein","🎬","einen Tag lang Filmstar sein"]
];
var cats=["Alle"].concat(Q.map(function(x){return x[0]}).filter(function(v,i,a){return a.indexOf(v)===i}));
var cur="Alle",list=[],i=0,picked=false;
function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
function chips(){var c=document.getElementById("chips");c.innerHTML="";cats.forEach(function(n){var b=document.createElement("button");b.className="chip"+(n===cur?" on":"");b.textContent=n;b.onclick=function(){cur=n;start();chips()};c.appendChild(b)})}
var mix=false;
function start(){var f=Q.filter(function(x){return cur==="Alle"||x[0]===cur});list=mix?shuffle(f):f;i=0;show()}
function show(){
var g=document.getElementById("game");picked=false;
if(i>=list.length){g.innerHTML='<div class="end"><div class="e">🎉</div><h2>Geschafft!</h2><p>Du hast alle Fragen durch.</p><button class="next" id="again">Nochmal spielen</button></div>';document.getElementById("again").onclick=start;return}
var q=list[i];
g.innerHTML='<div class="cat">'+q[0]+'</div><div class="q">Würdest du lieber …</div><div class="opts"><button class="opt" id="oa"><span class="e">'+q[1]+'</span><span>'+q[2]+'</span></button><button class="opt" id="ob"><span class="e">'+q[3]+'</span><span>'+q[4]+'</span></button></div><div class="bar"><button class="next ghost" id="bk"'+(i===0?' disabled':'')+'>⬅</button><span class="count">Frage '+(i+1)+' von '+list.length+'</span><button class="next" id="nx">Weiter ➜</button></div>';
document.getElementById("bk").onclick=function(){if(i>0){i--;show()}};
function pick(w,l){if(picked)return;picked=true;document.getElementById(w).classList.add("pick");document.getElementById(l).classList.add("dim");document.getElementById("nx").disabled=false}
document.getElementById("oa").onclick=function(){pick("oa","ob")};
document.getElementById("ob").onclick=function(){pick("ob","oa")};
document.getElementById("nx").onclick=function(){i++;show()};
}
function mixl(){document.getElementById("mixb").textContent=mix?"🔀 Gemischt":"🔀 Mischen"}
function menu(){var m=document.getElementById("menu"),h='<div class="mh"><b>Alle Fragen</b><button class="chip" id="mc">✕ Schließen</button></div>',last="";
Q.forEach(function(q,k){if(q[0]!==last){last=q[0];h+='<h3>'+last+'</h3>'}h+='<button class="mi" data-k="'+k+'"><b>'+(k+1)+'.</b> '+q[1]+' '+q[2]+' <i>oder</i> '+q[3]+' '+q[4]+'</button>'});
m.innerHTML=h;m.classList.add("show");
document.getElementById("mc").onclick=function(){m.classList.remove("show")};
Array.prototype.forEach.call(m.querySelectorAll(".mi"),function(b){b.onclick=function(){cur="Alle";mix=false;mixl();list=Q;i=+b.getAttribute("data-k");chips();m.classList.remove("show");show()}})}
document.getElementById("menub").onclick=menu;
document.getElementById("mixb").onclick=function(){mix=!mix;mixl();start()};
chips();start();
</script>
</body>
</html>
